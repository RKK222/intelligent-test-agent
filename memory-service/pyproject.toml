[project]
name = "testagent-memory-service"
version = "0.1.0"
description = "Test Agent 通用记忆编排与多 profile Mem0 REST 服务"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "mem0ai==2.0.17",
  "psycopg[binary,pool]==3.3.4",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "testcontainers[postgres]==4.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "testcontainers[postgres]==4.12.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project.scripts]
testagent-memory = "testagent_memory_service.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/testagent_memory_service"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
