[project]
name = "testagent-memory-service"
version = "0.1.0"
description = "QA Agent 自托管 Mem0 与本地中文向量服务"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "mem0ai==2.0.3",
  "psycopg[binary,pool]==3.3.4",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "sentence-transformers==5.1.2",
  "torch==2.9.1",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "testcontainers[postgres]==4.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "testcontainers[postgres]==4.12.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project.scripts]
testagent-memory = "testagent_memory_service.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/testagent_memory_service"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
