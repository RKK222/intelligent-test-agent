  regex-memo:
    title: 正则表达式速查表
    description: 快速查阅常用的 JavaScript 正则表达式语法。
    ui:
      content: |-
        ### 普通字符

        表达式 ¦ 说明
        :--¦:--
        `.` 或 `[^\n\r]` ¦ 除换行符和回车符以外的任意字符
        `[A-Za-z]` ¦ 字母
        `[a-z]` ¦ 小写字母
        `[A-Z]` ¦ 大写字母
        `\d` 或 `[0-9]` ¦ 数字
        `\D` 或 `[^0-9]` ¦ 非数字
        `_` ¦ 下划线
        `\w` 或 `[A-Za-z0-9_]` ¦ 字母、数字或下划线
        `\W` 或 `[^A-Za-z0-9_]` ¦ `\w` 的反向匹配
        `\S` ¦ `\s` 的反向匹配

        ### 空白字符

        表达式 ¦ 说明
        :--¦:--
        ` ` ¦ 空格
        `\t` ¦ 制表符
        `\n` ¦ 换行符
        `\r` ¦ 回车符
        `\s` ¦ 空格、制表符、换行符或回车符

        ### 字符集

        表达式 ¦ 说明
        :--¦:--
        `[xyz]` ¦ `x`、`y` 或 `z` 中任意一个
        `[^xyz]` ¦ 不为 `x`、`y` 或 `z`
        `[1-3]` ¦ `1`、`2` 或 `3` 中任意一个
        `[^1-3]` ¦ 不为 `1`、`2` 或 `3`

        - 字符集相当于对方括号内的单个字符执行“或”运算。
        - 在起始 `[` 后使用 `^` 可对字符集取反。
        - 在字符集中，`.` 表示普通句点。

        ### 需要转义的字符

        #### 字符集外部

        表达式 ¦ 说明
        :--¦:--
        `\.` ¦ 句点
        `\^` ¦ 脱字符
        `\$` ¦ 美元符号
        `\¦` ¦ 竖线
        `\\` ¦ 反斜杠
        `\/` ¦ 正斜杠
        `\(` ¦ 左圆括号
        `\)` ¦ 右圆括号
        `\[` ¦ 左方括号
        `\]` ¦ 右方括号
        `\⦃` ¦ 左花括号
        `\⦄` ¦ 右花括号

        #### 字符集内部

        表达式 ¦ 说明
        :--¦:--
        `\\` ¦ 反斜杠
        `\]` ¦ 右方括号

        - 仅当 `^` 紧跟在字符集起始 `[` 后时才需要转义。
        - 仅当 `-` 位于两个字母或两个数字之间时才需要转义。

        ### 量词

        表达式 ¦ 说明
        :--¦:--
        `⦃2⦄` ¦ 恰好 2 次
        `⦃2,⦄` ¦ 至少 2 次
        `⦃2,7⦄` ¦ 至少 2 次且不超过 7 次
        `*` ¦ 0 次或多次
        `+` ¦ 1 次或多次
        `?` ¦ 恰好 0 次或 1 次

        - 量词应放在待量化表达式之后。

        ### 边界

        表达式 ¦ 说明
        :--¦:--
        `^` ¦ 字符串开头
        `$` ¦ 字符串结尾
        `\b` ¦ 单词边界

        - 单词边界的匹配方式：
            - 如果首字符为 `\w`，则匹配字符串开头。
            - 如果两个相邻字符中前一个为 `\w`、后一个为 `\W`，则匹配二者之间的位置。
            - 如果末字符为 `\w`，则匹配字符串结尾。

        ### 匹配

        表达式 ¦ 说明
        :--¦:--
        `foo\¦bar` ¦ 匹配 `foo` 或 `bar`
        `foo(?=bar)` ¦ 当 `foo` 后面是 `bar` 时匹配 `foo`
        `foo(?!bar)` ¦ 当 `foo` 后面不是 `bar` 时匹配 `foo`
        `(?<=bar)foo` ¦ 当 `foo` 前面是 `bar` 时匹配 `foo`
        `(?<!bar)foo` ¦ 当 `foo` 前面不是 `bar` 时匹配 `foo`

        ### 分组与捕获

        表达式 ¦ 说明
        :--¦:--
        `(foo)` ¦ 捕获组；匹配并捕获 `foo`
        `(?:foo)` ¦ 非捕获组；匹配 `foo` 但不捕获
        `(foo)bar\1` ¦ `\1` 反向引用第 1 个捕获组；匹配 `foobarfoo`

        - 捕获组仅与以下方法有关：
            - `string.match(regexp)`
            - `string.matchAll(regexp)`
            - `string.replace(regexp, callback)`
        - `\N` 反向引用第 `N` 个捕获组。捕获组从 1 开始编号。

        ## 参考资料与工具

        - [MDN](https://developer.mozilla.org/zh-CN/docs/Web/JavaScript/Guide/Regular_expressions)
        - [RegExplained](https://leaverou.github.io/regexplained/)

