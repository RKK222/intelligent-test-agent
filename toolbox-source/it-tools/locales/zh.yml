  git-memo:
    title: Git 备忘录
    description: 快速查阅常用 Git 命令和操作方法。
    ui:
      content: |-
        ## 配置

        设置全局配置

        ```shell
        git config --global user.name "[name]"
        git config --global user.email "[email]"
        ```

        ## 开始使用

        创建 Git 仓库

        ```shell
        git init
        ```

        克隆现有 Git 仓库

        ```shell
        git clone [url]
        ```

        ## 提交

        提交所有已跟踪的更改

        ```shell
        git commit -am "[commit message]"
        ```

        将新修改追加到上一次提交

        ```shell
        git commit --amend --no-edit
        ```

        ## 操作失误后的处理

        修改上一次提交信息

        ```shell
        git commit --amend
        ```

        撤销最近一次提交并保留更改

        ```shell
        git reset HEAD~1
        ```

        撤销最近 `N` 次提交并保留更改

        ```shell
        git reset HEAD~N
        ```

        撤销最近一次提交并丢弃更改

        ```shell
        git reset HEAD~1 --hard
        ```

        将分支重置为远程状态

        ```shell
        git fetch origin
        git reset --hard origin/[branch-name]
        ```

        ## 其他操作

        重命名本地主分支

        ```shell
        git branch -m master main
        ```

