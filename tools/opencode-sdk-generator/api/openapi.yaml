  /api/experimental/session/{sessionID}/log:
    get:
      description: Experimental durable session event log. Reads events after an exclusive
        aggregate sequence and continues with live events when follow=true.
      operationId: session.log
      parameters:
      - explode: false
        in: path
        name: sessionID
        required: true
        schema:
          pattern: ^ses
          type: string
        style: simple
      - explode: true
        in: query
        name: after
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: follow
        required: false
        schema:
          enum:
          - "true"
          - "false"
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/session_log_200_response"
              x-effect-stream:
                encoding: sse
                causeSchema:
                  type: array
                  items:
                    anyOf:
                    - type: object
                      properties:
                        _tag:
                          type: string
                          enum:
                          - Fail
                        error:
                          not: {}
                      required:
                      - _tag
                      - error
                      additionalProperties: false
                    - type: object
                      properties:
                        _tag:
                          type: string
                          enum:
                          - Die
                        defect: {}
                      required:
                      - _tag
                      - defect
                      additionalProperties: false
                    - type: object
                      properties:
                        _tag:
                          type: string
                          enum:
                          - Interrupt
                        fiberId:
                          anyOf:
                          - type: number
                          - type: "null"
                      required:
                      - _tag
                      - fiberId
                      additionalProperties: false
                errorSchema:
                  not: {}
                failureEvent: effect/httpapi/stream/failure
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestErrorEncoded"
          description: InvalidRequestError
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
          description: UnauthorizedError
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionNotFoundErrorEncoded"
          description: SessionNotFoundError
      security: []
      summary: Read the session log
      tags:
      - session
      x-accepts:
      - application/json
      - text/event-stream
