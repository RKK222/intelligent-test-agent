openapi: 3.1.0
info:
  description: Experimental HttpApi surface for selected instance routes.
  title: opencode HttpApi
  version: 0.0.1
servers:
- url: http://127.0.0.1:4096
tags:
- name: agent
- description: Experimental command routes.
  name: command
- description: Location-scoped configuration routes.
  name: config
- name: credential
- name: debug
- description: Experimental event stream routes.
  name: event
- description: Experimental location-scoped filesystem routes.
  name: filesystem
- description: Location form routes.
  name: form
- description: Experimental one-shot generation routes.
  name: generate
- description: Integration discovery and authentication routes.
  name: integration
- name: location
- description: MCP server and resource routes.
  name: mcp
- name: migration
- description: Experimental model routes.
  name: model
- description: Experimental permission routes.
  name: permission
- description: Prototype persistent PTY routes.
  name: persistentPty
- description: Experimental plugin routes.
  name: plugin
- description: Project routes.
  name: project
- description: Experimental provider routes.
  name: provider
- description: Experimental location-scoped PTY routes.
  name: pty
- description: Location-scoped project references.
  name: reference
- description: Plugin RPC routes.
  name: rpc
- name: server
- description: Experimental session routes.
  name: session
- description: Location-scoped shell command routes.
  name: shell
- description: Experimental skill routes.
  name: skill
- description: Location-scoped version control routes.
  name: vcs
- description: Location-scoped web search routes.
  name: websearch
- description: Project-based worktree management routes.
  name: worktree
paths:
  /api/info:
    get:
      description: "Return the server identity, connection URLs, paths, and readiness\
        \ status."
      operationId: server.info
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"
          description: ServerInfo
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestErrorEncoded"
          description: InvalidRequestError
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
          description: UnauthorizedError
      security: []
      summary: Get server info
      tags:
      - server
      x-accepts:
      - application/json
  /api/pair:
    post:
      description: "Create a short-lived, single-use code for a /auth/connect/:code\
        \ pairing link."
      operationId: server.pair
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingCode"
          description: PairingCode
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestErrorEncoded"
          description: InvalidRequestError
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
          description: UnauthorizedError
      security: []
      summary: Create pairing code
      tags:
      - server
      x-accepts:
      - application/json
  /auth/connect/{code}:
    get:
      description: Redeem a pairing code. Browsers receive a session cookie and a
        redirect to the web app; requests that accept JSON receive a session token
        to use as the password.
      operationId: server.connect
      parameters:
      - explode: false
        in: path
        name: code
        required: true
        schema:
          description: Maximum number of sessions to return. Defaults to the newest
            50 sessions.
          nullable: true
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingSession"
          description: PairingSession
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestErrorEncoded"
          description: InvalidRequestError
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/server_connect_401_response"
          description: UnauthorizedError
      security: []
      summary: Redeem pairing code
      tags:
      - server
      x-accepts:
      - application/json
  /api/location:
    get:
      description: Resolve the requested location or the server default location.
      operationId: location.get
      parameters:
      - explode: true
        in: query
        name: location
        required: false
        schema:
          $ref: "#/components/schemas/location_get_location_parameter"
        style: deepObject
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location.PublicInfo"
          description: Location.PublicInfo
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestErrorEncoded"
          description: InvalidRequestError
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
          description: UnauthorizedError
      security: []
      summary: Get location
      tags:
      - location
      x-accepts:
      - application/json
  /api/location/reload:
    post:
      description: Shut down and rebuild every loaded location. Pending permissions
        and forms are cancelled; running sessions continue with fresh services at
        the next step boundary. Emits location.shutdown for client recovery and responds
        once all replacement builds settle.
      operationId: location.reload
      parameters: []
      responses:
        "204":
          description: <No Content>
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestErrorEncoded"
          description: InvalidRequestError
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
          description: UnauthorizedError
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceUnavailableErrorEncoded"
          description: ServiceUnavailableError
      security: []
      summary: Reload configuration
      tags:
      - location
      x-accepts:
      - application/json
  /api/agent:
    get:
      description: Retrieve currently registered agents.
      operationId: agent.list
      parameters:
      - explode: true
        in: query
        name: location
        required: false
        schema:
          $ref: "#/components/schemas/agent_list_location_parameter"
        style: deepObject
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/agent_list_200_response"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestErrorEncoded"
          description: InvalidRequestError
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
          description: UnauthorizedError
      security: []
      summary: List agents
      tags:
      - agent
      x-accepts:
      - application/json
  /api/agent/{agentID}:
    get:
      description: Retrieve a single currently registered agent.
      operationId: agent.get
      parameters:
      - explode: false
        in: path
        name: agentID
        required: true
        schema:
          description: Maximum number of sessions to return. Defaults to the newest
            50 sessions.
          nullable: true
          type: string
        style: simple
      - explode: true
        in: query
        name: location
        required: false
        schema:
          $ref: "#/components/schemas/agent_list_location_parameter"
        style: deepObject
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/agent_get_200_response"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestErrorEncoded"
          description: InvalidRequestError
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
          description: UnauthorizedError
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentNotFoundErrorEncoded"
          description: AgentNotFoundError
      security: []
      summary: Get agent
      tags:
      - agent
      x-accepts:
      - application/json
  /api/plugin:
    get:
      description: Retrieve enabled server plugins and their current status.
      operationId: plugin.list
      parameters:
      - explode: true
        in: query
        name: location
        required: false
        schema:
          $ref: "#/components/schemas/agent_list_location_parameter"
        style: deepObject
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/plugin_list_200_response"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestErrorEncoded"
          description: InvalidRequestError
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
          description: UnauthorizedError
      security: []
      summary: List plugins
      tags:
      - plugin
      x-accepts:
      - application/json
  /api/plugin/check:
    post:
      description: Check one or all package plugins for available updates.
      operationId: plugin.check
      parameters:
      - explode: true
        in: query
        name: location
        required: false
        schema:
          $ref: "#/components/schemas/agent_list_location_parameter"
        style: deepObject
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/plugin_check_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/plugin_check_200_response"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/plugin_check_400_response"
          description: InvalidRequestError
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
          description: UnauthorizedError
      security: []
      summary: Check plugin updates
      tags:
      - plugin
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/plugin/update:
    post:
      description: Update package plugins concurrently and notify active locations
        to reload them. Responds once every update has finished; fails when any update
        fails.
      operationId: plugin.update
      parameters:
      - explode: true
        in: query
        name: location
        required: false
        schema:
          $ref: "#/components/schemas/agent_list_location_parameter"
        style: deepObject
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/plugin_update_request"
        required: true
      responses:
        "204":
          description: <No Content>
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/plugin_check_400_response"
          description: InvalidRequestError
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
          description: UnauthorizedError
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceUnavailableErrorEncoded"
          description: ServiceUnavailableError
      security: []
      summary: Update plugins
      tags:
      - plugin
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/session:
    get:
      description: Retrieve sessions in the requested order. Items keep that order
        across pages; use cursor.next or cursor.previous to move through the ordered
        list.
      operationId: session.list
      parameters:
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          description: Maximum number of sessions to return. Defaults to the newest
            50 sessions.
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: order
        required: false
        schema:
          description: Session order for the first page. Use desc for newest first
            or asc for oldest first.
          enum:
          - asc
          - desc
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: search
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: parentID
        required: false
        schema:
          description: Filter by parent session. Use null to return only root sessions.
          nullable: true
          pattern: ^ses
          type: string
        style: form
      - explode: true
        in: query
        name: directory
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: project
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: subpath
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: cursor
        required: false
        schema:
          description: Opaque pagination cursor returned as cursor.previous or cursor.next
            in the previous response.
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsResponse"
          description: SessionsResponse
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/session_list_400_response"
          description: InvalidCursorError | InvalidRequestError
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
          description: UnauthorizedError
      security: []
      summary: List sessions
      tags:
      - session
      x-accepts:
      - application/json
    post:
      description: Create a session at the requested location.
      operationId: session.create
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/session_create_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/session_create_200_response"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestErrorEncoded"
          description: InvalidRequestError
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
          description: UnauthorizedError
      security: []
      summary: Create session
      tags:
      - session
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/experimental/session/stats:
    get:
      description: "Aggregate local session activity, usage, and tool reliability\
        \ for a time range."
      operationId: experimental.session.stats
      parameters:
      - explode: true
        in: query
        name: from
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: to
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: project
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: timezone
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: tools
        required: false
        schema:
          enum:
          - none
          - summary
          - detail
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/experimental_session_stats_200_response"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/plugin_check_400_response"
          description: InvalidRequestError
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
          description: UnauthorizedError
      security: []
      summary: Get session statistics
      tags:
      - session
      x-accepts:
      - application/json
  /api/experimental/session/import:
    post:
      description: "Import a projected session transcript at the requested location.\
        \ If parentID is supplied, the parent session must already exist; import parents\
        \ before children."
      operationId: experimental.session.import
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/experimental_session_import_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/experimental_session_import_200_response"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestErrorEncoded"
          description: InvalidRequestError
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
          description: UnauthorizedError
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionNotFoundErrorEncoded"
          description: SessionNotFoundError
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictErrorEncoded"
          description: ConflictError
      security: []
      summary: Import session
      tags:
      - session
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/experimental/session/{sessionID}/export:
    get:
      description: Export a complete projected session transcript.
      operationId: experimental.session.export
      parameters:
      - explode: false
        in: path
        name: sessionID
        required: true
        schema:
          nullable: true
          pattern: ^ses
          type: string
        style: simple
      - explode: true
        in: query
        name: sanitize
        required: false
        schema:
          enum:
          - "true"
          - "false"
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/experimental_session_export_200_response"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestErrorEncoded"
          description: InvalidRequestError
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
          description: UnauthorizedError
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionNotFoundErrorEncoded"
          description: SessionNotFoundError
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnknownErrorEncoded"
          description: UnknownError
      security: []
      summary: Export session
      tags:
      - session
      x-accepts:
      - application/json
  /api/session/active:
    get:
      description: Retrieve foreground Session drains currently owned by this OpenCode
        process. Sessions absent from the result are inactive.
      operationId: session.active
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/session_active_200_response"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestErrorEncoded"
          description: InvalidRequestError
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
          description: UnauthorizedError
      security: []
      summary: List active sessions
      tags:
      - session
      x-accepts:
      - application/json
  /api/session/{sessionID}:
    delete:
      description: Delete a session and its child sessions.
      operationId: session.remove
      parameters:
      - explode: false
        in: path
        name: sessionID
        required: true
        schema:
          pattern: ^ses
          type: string
        style: simple
      responses:
        "204":
          description: <No Content>
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestErrorEncoded"
          description: InvalidRequestError
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
          description: UnauthorizedError
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionNotFoundErrorEncoded"
          description: SessionNotFoundError
      security: []
      summary: Delete session
      tags:
      - session
      x-accepts:
      - application/json
    get:
      description: Retrieve a session by ID.
      operationId: session.get
      parameters:
      - explode: false
        in: path
        name: sessionID
        required: true
        schema:
          pattern: ^ses
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/experimental_session_import_200_response"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestErrorEncoded"
          description: InvalidRequestError
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
          description: UnauthorizedError
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionNotFoundErrorEncoded"
          description: SessionNotFoundError
      security: []
      summary: Get session
      tags:
      - session
      x-accepts:
      - application/json
    patch:
      description: Update mutable session properties.
      operationId: session.update
      parameters:
      - explode: false
        in: path
        name: sessionID
        required: true
        schema:
          pattern: ^ses
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/session_update_request"
        required: true
      responses:
        "204":
          description: <No Content>
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestErrorEncoded"
          description: InvalidRequestError
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
          description: UnauthorizedError
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/session_update_404_response"
          description: SessionNotFoundError
      security: []
      summary: Update session
      tags:
      - session
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/session/{sessionID}/fork:
    post:
      description: Create a child session by copying projected history before a message.
        Omit before to copy the full history.
      operationId: session.fork
      parameters:
      - explode: false
        in: path
        name: sessionID
        required: true
        schema:
          pattern: ^ses
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/session_fork_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/experimental_session_import_200_response"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/plugin_check_400_response"
          description: InvalidRequestError
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
          description: UnauthorizedError
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/session_fork_404_response"
          description: SessionNotFoundError | MessageNotFoundError
      security: []
      summary: Fork session
      tags:
      - session
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/session/{sessionID}/agent:
    post:
      description: Switch the agent used by subsequent provider turns.
      operationId: session.switchAgent
      parameters:
      - explode: false
        in: path
        name: sessionID
        required: true
        schema:
          pattern: ^ses
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/session_switchAgent_request"
        required: true
      responses:
        "204":
          description: <No Content>
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestErrorEncoded"
          description: InvalidRequestError
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
          description: UnauthorizedError
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/session_update_404_response"
          description: SessionNotFoundError
      security: []
      summary: Switch session agent
      tags:
      - session
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/session/{sessionID}/model:
    post:
      description: Switch the model used by subsequent provider turns.
      operationId: session.switchModel
