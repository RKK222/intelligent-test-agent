  /api/session/{sessionID}/diff:
    get:
      description: "Structured per-file diffs of the files a turn changed. A turn\
        \ runs from the first prompt after the session was last idle until its next\
        \ idle marker, so prompts steered in while it was busy belong to the same\
        \ turn; `to` extends the range through a later turn. Compares the range's\
        \ first recorded snapshot with its last; a step still running in the active\
        \ session compares against the working copy. Ranges that span a location change\
        \ are rejected. In sessions without any idle marker, a prompt's turn spans\
        \ until the next user message."
      operationId: session.diff
      parameters:
      - explode: false
        in: path
        name: sessionID
        required: true
        schema:
          pattern: ^ses
          type: string
        style: simple
      - explode: true
        in: query
        name: from
        required: false
        schema:
          description: User message whose turn to diff. Defaults to the turn of the
            newest user message.
          nullable: true
          pattern: ^msg_
          type: string
        style: form
      - explode: true
        in: query
        name: to
        required: false
        schema:
          description: User message whose turn to diff. Defaults to the turn of the
            newest user message.
          nullable: true
          pattern: ^msg_
          type: string
        style: form
      - explode: true
        in: query
        name: context
        required: false
        schema:
          description: Maximum number of sessions to return. Defaults to the newest
            50 sessions.
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/session_diff_200_response"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/plugin_check_400_response"
          description: InvalidRequestError
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
          description: UnauthorizedError
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/session_diff_404_response"
          description: MessageNotFoundError | SessionNotFoundError
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnknownErrorEncoded"
          description: UnknownError
      security: []
      summary: Diff session turns
      tags:
      - session
      x-accepts:
      - application/json
