  /api/event:
    get:
      description: "Subscribe to native events and plugin RPC events across all server\
        \ locations. Volatile by contract: a slow consumer overflows and fails the\
        \ stream, and events during disconnection are missed."
      operationId: event.subscribe
      parameters: []
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/event_subscribe_200_response"
              x-effect-stream:
                encoding: sse
                causeSchema:
                  type: array
                  items:
                    anyOf:
                    - type: object
                      properties:
                        _tag:
                          type: string
                          enum:
                          - Fail
                        error:
                          not: {}
                      required:
                      - _tag
                      - error
                      additionalProperties: false
                    - type: object
                      properties:
                        _tag:
                          type: string
                          enum:
                          - Die
                        defect: {}
                      required:
                      - _tag
                      - defect
                      additionalProperties: false
                    - type: object
                      properties:
                        _tag:
                          type: string
                          enum:
                          - Interrupt
                        fiberId:
                          anyOf:
                          - type: number
                          - type: "null"
                      required:
                      - _tag
                      - fiberId
                      additionalProperties: false
                errorSchema:
                  not: {}
                failureEvent: effect/httpapi/stream/failure
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestErrorEncoded"
          description: InvalidRequestError
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
          description: UnauthorizedError
      security: []
      summary: Subscribe to events
      tags:
      - event
      x-accepts:
      - application/json
      - text/event-stream
