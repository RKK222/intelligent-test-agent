          description: Maximum number of sessions to return. Defaults to the newest
            50 sessions.
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: order
        required: false
        schema:
          description: Message order for the first page. Use desc for newest first
            or asc for oldest first.
          enum:
          - asc
          - desc
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: cursor
        required: false
        schema:
          description: Opaque pagination cursor returned as cursor.previous or cursor.next
            in the previous response. Do not combine with order.
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: type
        required: false
        schema:
          description: "Filter by message type before pagination. When omitted, all\
