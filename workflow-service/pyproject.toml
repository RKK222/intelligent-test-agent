[project]
name = "testagent-workflow-service"
version = "0.1.0"
description = "独立的长程任务对话、编排与代码影响分析服务"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agentscope==2.0.4.post1",
  "alembic==1.16.5",
  "asyncpg==0.30.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "langgraph==1.2.9",
  "langgraph-checkpoint-postgres==3.0.4",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "psycopg[binary]==3.3.4",
  "redis==6.4.0",
  "sqlalchemy[asyncio]==2.0.43",
  "sse-starlette==3.0.2",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "testcontainers[postgres,redis]==4.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "testcontainers[postgres,redis]==4.12.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project.scripts]
testagent-workflow = "testagent_workflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/testagent_workflow"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
