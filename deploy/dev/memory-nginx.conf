worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log off;
    error_log /dev/stderr warn;
    client_max_body_size 2m;

    upstream memory_cluster {
        zone memory_cluster 64k;
        least_conn;
        server memory-service-1:18888 max_fails=2 fail_timeout=5s;
        server memory-service-2:18888 max_fails=2 fail_timeout=5s;
        server memory-service-3:18888 max_fails=2 fail_timeout=5s;
        keepalive 32;
    }

    server {
        listen 18888;
        server_name _;

        location / {
            proxy_pass http://memory_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 135s;
            proxy_send_timeout 135s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
}
