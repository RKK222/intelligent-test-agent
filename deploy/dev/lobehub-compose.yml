name: test-agent-lobehub-dev

# 仅供本地 --with-lobehub 使用；企业现场仍由 deploy/internal/lobehub-docker.sh 管理。
services:
  paradedb:
    image: ${LOBEHUB_DEV_PARADEDB_IMAGE:-paradedb/paradedb@sha256:ba45fac6b9b3bd5e91407c9c4b1657b8300b78beb24f60eb03b266120b26699c}
    container_name: test-agent-lobehub-dev-db
    command: [postgres, -c, shared_preload_libraries=pg_search]
    environment:
      POSTGRES_DB: lobehub
      POSTGRES_PASSWORD: ${LOBEHUB_DEV_DB_PASSWORD}
      POSTGRES_USER: lobehub
    healthcheck:
      test: [CMD-SHELL, pg_isready -U lobehub -d lobehub]
      interval: 2s
      retries: 60
      timeout: 3s
    ports:
      - 127.0.0.1:${LOBEHUB_DEV_DB_PORT:-55432}:5432
    restart: unless-stopped
    volumes:
      - lobehub-paradedb:/var/lib/postgresql/data

  rustfs:
    image: ${LOBEHUB_DEV_RUSTFS_IMAGE:-rustfs/rustfs@sha256:e4151ec4728f4d39a714a2c5f6e1f4bc8e0789fe5af4874b95121bae39c6cd12}
    container_name: test-agent-lobehub-dev-rustfs
    command:
      - --access-key
      - ${RUSTFS_ACCESS_KEY}
      - --secret-key
      - ${RUSTFS_SECRET_KEY}
      - /data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    healthcheck:
      test: [CMD-SHELL, wget -qO- http://localhost:9000/health >/dev/null 2>&1 || exit 1]
      interval: 2s
      retries: 60
      timeout: 3s
    ports:
      - 127.0.0.1:${LOBEHUB_DEV_S3_PORT:-59000}:9000
      - 127.0.0.1:${LOBEHUB_DEV_S3_CONSOLE_PORT:-59001}:9001
    restart: unless-stopped
    volumes:
      - lobehub-rustfs:/data

  rustfs-init:
    image: ${LOBEHUB_DEV_MC_IMAGE:-minio/mc@sha256:eb4ea9884b77704230e2423e9004d2fa738dc272876b9cc41a297d29443b8780}
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: /bin/sh
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    command:
      - -c
      - >-
        set -eu;
        mc alias set lobehub http://rustfs:9000 "$${RUSTFS_ACCESS_KEY}" "$${RUSTFS_SECRET_KEY}";
        mc mb --ignore-existing lobehub/lobehub-private;
        mc anonymous set none lobehub/lobehub-private
    restart: 'no'

volumes:
  lobehub-paradedb:
  lobehub-rustfs:
