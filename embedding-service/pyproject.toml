[project]
name = "testagent-embedding-service"
version = "1.0.0"
description = "固定 BAAI/bge-small-zh-v1.5 的 CPU OpenAI-compatible embedding 服务"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "sentence-transformers==5.1.2",
  "torch==2.9.1",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project.scripts]
testagent-embedding = "testagent_embedding_service.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/testagent_embedding_service"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
